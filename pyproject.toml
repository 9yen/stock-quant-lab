[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant-lab"
dynamic = ["version"]
description = "A bilingual, local paper-trading lab for learning trading infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "9yen"}]
dependencies = ["python-dotenv>=1,<2", "tzdata>=2025.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.42,<1", "certifi>=2026.10.19"]
research = ["pandas>=2.2,<4", "yfinance>=0.2,<2", "matplotlib>=3.9,<4", "certifi>=2026.10.19"]
moomoo = ["moomoo-api==10.11.7108", "certifi>=2026.10.19"]
tiger = ["tigeropen==3.8.0", "certifi>=2026.10.19"]
dev = ["ruff==0.17.1", "build>=1.2,<2", "setuptools>=77", "wheel"]

[project.scripts]
quant-lab = "quant_lab.cli:main"

[project.urls]
Repository = "https://github.com/9yen/stock-quant-lab"
Issues = "https://github.com/9yen/stock-quant-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant_lab.dashboard" = ["assets/*", "assets/locales/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples/legacy", "scripts/compat"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821", "F822", "F823", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.dynamic]
version = {attr = "quant_lab.__version__"}
