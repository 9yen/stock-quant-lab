name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docker-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target paper -t quant-lab-paper:test .
      - run: docker run --rm --entrypoint python quant-lab-paper:test -c "import alpaca, moomoo, pandas; print('SDK imports OK')"
      - name: Linux offline regression tests in installed image
        run: docker run --rm --mount "type=bind,src=$PWD/tests,dst=/data/tests,readonly" --entrypoint python quant-lab-paper:test -m unittest discover -s /data/tests
      - run: python scripts/smoke_container.py --image quant-lab-paper:test
      - name: Fresh image cannot start execution
        run: |
          set +e
          output=$(timeout 15s docker run --rm quant-lab-paper:test 2>&1)
          result=$?
          set -e
          test "$result" -eq 1
          echo "$output" | grep 'FileNotFoundError'
  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify synthetic endpoint and isolation
        run: |
          python - <<'PY'
          import json, urllib.request
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8767/api/automation'))
          assert data['status'] == 'DEMO'
          assert not data['alpaca']['enabled'] and not data['moomoo']['enabled']
          PY
          docker compose exec -T demo python -c "import importlib.util; assert importlib.util.find_spec('alpaca') is None; assert importlib.util.find_spec('moomoo') is None"
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s scripts -p test_publication.py
      - run: ruff check src tests scripts daily_optimize.py
      - run: ruff format --check src tests scripts daily_optimize.py
      - run: node --test tests/test_i18n.cjs
      - name: JavaScript syntax
        run: find src/quant_lab/dashboard/assets -name '*.js' -print0 | xargs -0 -n1 node --check
  offline-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[alpaca,research]'
      - run: python -m unittest discover -s tests
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip uninstall -y stock-quant-lab
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          quant-lab --help
          quant-lab --home "$RUNNER_TEMP/quant-lab-smoke" status --json
          quant-lab --home "$RUNNER_TEMP/quant-lab-smoke" doctor --json
          python -c "import sys; import quant_lab.dashboard.web; assert 'tkinter' not in sys.modules"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
